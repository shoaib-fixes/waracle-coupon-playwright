name: Coupon E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run the E2E suite in
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      workers:
        description: Parallel scenario workers
        default: "4"

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The application under test, pinned so a run is reproducible.
  APP_REPO: Waracle/qa-candidate-test
  APP_REF: e123f7a7ab9bf4b0b7278f9ff839c2bda812efea
  BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
  WORKERS: ${{ github.event.inputs.workers || '4' }}
  # Pull requests from forks run with a read-only token, so steps that create check runs are
  # skipped for them; their results are still uploaded as artefacts.
  CAN_WRITE_CHECKS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  unit:
    name: Unit tests (pricing oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check formatting (.editorconfig)
        run: dotnet format --verify-no-changes

      - name: Test
        run: >
          dotnet test tests/WaracleStore.CouponTests.UnitTests
          --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Report
        uses: dorny/test-reporter@v3
        if: always() && env.CAN_WRITE_CHECKS == 'true'
        with:
          name: Unit tests
          path: TestResults/unit.trx
          reporter: dotnet-trx

  e2e:
    name: E2E (${{ github.event.inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      TEST_Browser: ${{ github.event.inputs.browser || 'chromium' }}
      TEST_TraceMode: RetainOnFailure
      TEST_ArtifactsDirectory: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Check out Waracle Store
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Installed from the monorepo root on purpose: the web app's in-browser mock imports
      # bcryptjs, which only the backend workspace declares (see README → Observations).
      - name: Install store dependencies
        working-directory: app
        run: npm ci --workspace web --workspace backend --include-workspace-root

      - name: Start store (API :4000, web :5173)
        working-directory: app
        run: |
          npm run start:backend > backend.log 2>&1 &
          (cd web && VITE_API_URL=http://localhost:4000 npx vite --port 5173 --strictPort > ../web.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null && curl -sf http://localhost:5173 > /dev/null; then
              echo "Store is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Store did not start"; cat backend.log web.log; exit 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(grep -oP 'Include="Microsoft.Playwright" Version="\K[^"]+' src/WaracleStore.CouponTests/WaracleStore.CouponTests.csproj)" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.BROWSER }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install browser
        run: pwsh src/WaracleStore.CouponTests/bin/Release/net10.0/playwright.ps1 install --with-deps ${{ env.BROWSER }}

      # Gate: every scenario except those that document a known release defect. Must be green.
      - name: E2E gate
        run: >
          dotnet test src/WaracleStore.CouponTests
          --no-build --configuration Release
          --settings src/WaracleStore.CouponTests/test.runsettings
          --filter "TestCategory!=KnownDefect"
          --logger "trx;LogFileName=e2e-gate.trx"
          --results-directory TestResults
          -- NUnit.NumberOfTestWorkers=${{ env.WORKERS }}

      # Known defects: scenarios that fail on this build of the store because the release does
      # not meet its acceptance criteria. They run on every build so the moment a fix lands the
      # result flips, but they never block the pipeline.
      - name: Known release defects (expected to fail)
        if: always()
        continue-on-error: true
        run: >
          dotnet test src/WaracleStore.CouponTests
          --no-build --configuration Release
          --settings src/WaracleStore.CouponTests/test.runsettings
          --filter "TestCategory=KnownDefect"
          --logger "trx;LogFileName=known-defects.trx"
          --results-directory TestResults
          -- NUnit.NumberOfTestWorkers=${{ env.WORKERS }}

      # Both test steps write into the same allure-results folder, so one report covers the
      # gate and the known defects, with traces, screenshots and axe scans attached per scenario.
      # allurerc.mjs in the repo root supplies the grouping and known-issue rules.
      - name: Generate Allure report
        if: always()
        run: >
          npx --yes allure@3.18.0 generate src/WaracleStore.CouponTests/bin/Release/net10.0/allure-results
          -o allure-report
          --name "Waracle coupon suite (${{ env.BROWSER }})"

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report-${{ env.BROWSER }}
          path: allure-report/
          if-no-files-found: warn

      - name: Upload results, traces and screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ env.BROWSER }}
          path: |
            TestResults/
            artifacts/
            app/backend.log
            app/web.log
          if-no-files-found: warn

      - name: Report E2E gate
        uses: dorny/test-reporter@v3
        if: always() && env.CAN_WRITE_CHECKS == 'true'
        with:
          name: E2E gate (${{ env.BROWSER }})
          path: TestResults/e2e-gate.trx
          reporter: dotnet-trx

      - name: Report known release defects
        uses: dorny/test-reporter@v3
        if: always() && env.CAN_WRITE_CHECKS == 'true'
        with:
          name: Known release defects (${{ env.BROWSER }})
          path: TestResults/known-defects.trx
          reporter: dotnet-trx
          fail-on-error: false

  # Publishes the latest main-branch Allure report to GitHub Pages. Runs only on a public
  # repository (Pages is unavailable on private repositories of free accounts) and even when the
  # gate fails, because that is when the report matters most.
  pages:
    name: Publish report to GitHub Pages
    needs: e2e
    if: >-
      always() && needs.e2e.result != 'cancelled' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-chromium
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
